# Publishes a tiny redirect from the user site (xuedixuedi.github.io) to Vercel.
# This does not build the blog. Project Pages under the same account, such as
# /WishKit-LoveAndDeepspace/, are separate repositories. GitHub routes those
# paths to their own sites; this artifact is only index.html and 404.html.

name: Deploy GitHub Pages redirect

on:
  push:
    branches: ["main"]
    paths:
      - "gh-pages-redirect/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Upload redirect site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./gh-pages-redirect

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
